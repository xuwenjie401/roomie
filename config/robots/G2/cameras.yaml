# Canonical Roomie G2 color-camera profiles. Every image consumed by Roomie
# is rectified into this pinhole geometry before mask generation, mapping, and
# Boxer inference.

schema_version: 1
length_unit: meter
quaternion_order: [w, x, y, z]
transform_convention: T_parent_child

mask_defaults:
  sphere_padding_m: 0.003
  mask_dilation_px: 2

