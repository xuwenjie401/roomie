<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-label="Roomie pipeline overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#172033"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 700 54px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #cbd5e1; font: 400 24px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
      .box-title { fill: #f8fafc; font: 700 25px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
      .box-text { fill: #cbd5e1; font: 400 18px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
      .micro { fill: #94a3b8; font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; text-transform: uppercase; }
      .box { fill: #172033; stroke: #334155; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .accent-stroke { stroke: url(#accent); stroke-width: 3; fill: none; }
      .flow { stroke: #94a3b8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #475569; stroke-width: 1.5; fill: none; }
      .chip { fill: #0f172a; stroke: #334155; stroke-width: 1; rx: 14; }
    </style>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <path d="M70 112 C280 36 412 118 606 72 C830 18 1020 78 1174 54 C1320 31 1442 49 1530 96" class="accent-stroke" opacity="0.45"/>
  <path d="M88 610 C316 548 478 635 704 590 C955 539 1121 610 1392 552 C1467 536 1511 531 1560 538" class="accent-stroke" opacity="0.18"/>

  <text x="80" y="96" class="title">Roomie Pipeline</text>
  <text x="82" y="136" class="subtitle">A C++ ROS 2 object-mapping runtime with map-projected geometry and persistent scene memory.</text>

  <g transform="translate(80 210)">
    <rect class="box" width="210" height="210"/>
    <text x="24" y="44" class="micro">Sensors</text>
    <text x="24" y="84" class="box-title">RGB-D Stream</text>
    <text x="24" y="121" class="box-text">color image</text>
    <text x="24" y="151" class="box-text">depth image</text>
    <text x="24" y="181" class="box-text">robot mask + TF</text>
  </g>

  <path class="flow" d="M306 315 L365 315"/>

  <g transform="translate(382 210)">
    <rect class="box" width="230" height="210"/>
    <text x="24" y="44" class="micro">C++ ROS IO</text>
    <text x="24" y="84" class="box-title">Frame Assembly</text>
    <text x="24" y="121" class="box-text">time-aligned packets</text>
    <text x="24" y="151" class="box-text">camera intrinsics</text>
    <text x="24" y="181" class="box-text">world-frame poses</text>
  </g>

  <path class="flow" d="M630 315 L688 315"/>

  <g transform="translate(704 170)">
    <rect class="box" width="270" height="290"/>
    <text x="24" y="44" class="micro">Map Thread</text>
    <text x="24" y="84" class="box-title">3D Map Coupling</text>
    <text x="24" y="124" class="box-text">nvblox or CPU backend</text>
    <text x="24" y="154" class="box-text">masked RGB-D integration</text>
    <text x="24" y="184" class="box-text">near-surface projection</text>
    <line x1="24" y1="214" x2="246" y2="214" class="thin"/>
    <text x="24" y="248" class="box-text">60 x 60 patch depth</text>
    <text x="24" y="278" class="box-text">surface point snapshot</text>
  </g>

  <path class="flow" d="M994 315 L1053 315"/>

  <g transform="translate(1070 210)">
    <rect class="box" width="220" height="210"/>
    <text x="24" y="44" class="micro">Detection Bridge</text>
    <text x="24" y="84" class="box-title">Model Input</text>
    <text x="24" y="121" class="box-text">960 RGB resize</text>
    <text x="24" y="151" class="box-text">mask filtering</text>
    <text x="24" y="181" class="box-text">coverage gating</text>
  </g>

  <path class="flow" d="M1308 315 L1365 315"/>

  <g transform="translate(1382 210)">
    <rect class="box" width="150" height="210"/>
    <text x="22" y="44" class="micro">Python</text>
    <text x="22" y="84" class="box-title">Inference</text>
    <text x="22" y="121" class="box-text">OWL boxes</text>
    <text x="22" y="151" class="box-text">BoxerNet</text>
    <text x="22" y="181" class="box-text">3D OBBs</text>
  </g>

  <path class="flow" d="M1455 438 C1455 560 1220 588 1060 528"/>

  <g transform="translate(756 500)">
    <rect class="box" width="304" height="146"/>
    <text x="24" y="43" class="micro">Instance Map</text>
    <text x="24" y="82" class="box-title">Tracking And Fusion</text>
    <text x="24" y="117" class="box-text">stable object nodes + DSG JSON</text>
  </g>

  <path class="flow" d="M744 574 C548 612 448 537 398 431"/>

  <g transform="translate(126 480)">
    <rect class="chip" width="520" height="112"/>
    <text x="24" y="40" class="micro">Published View</text>
    <text x="24" y="76" class="box-text">/roomie/map_surface   /roomie/objects   /roomie/instances</text>
  </g>

  <g transform="translate(1132 500)">
    <rect class="chip" width="400" height="112"/>
    <text x="24" y="40" class="micro">Artifacts</text>
    <text x="24" y="76" class="box-text">RViz overlays, saved object graphs, browser viewer</text>
  </g>
</svg>
